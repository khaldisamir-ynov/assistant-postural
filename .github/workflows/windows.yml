# Windows : tests a chaque push et pull request ; sur un tag v*, construit AssistantPosture.exe (comme build.ps1)
# et l'ajoute a la release GitHub du meme nom.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Dependances
        run: pip install -r requirements.lock -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Construction de l'exe
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AssistantPosture `
            --paths . --add-data "posture\index.html;posture" --collect-data mediapipe `
            posture\__main__.py

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: AssistantPosture-Windows
          path: dist/AssistantPosture.exe

      - name: Ajout a la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/AssistantPosture.exe --clobber
